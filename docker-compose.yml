services:
  backend:
    # Antigravity Unlocker (AG_*_linux.tar.gz) выпускается только под x86_64/amd64.
    # На Apple Silicon (M1/M2/M3/M4) раскомментируйте строку ниже:
    # platform: linux/amd64
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_ADDR: 0.0.0.0:8080
      DB_PATH: /app/data/app.db
      PROVIDER: ${PROVIDER:-stub}
      ANTIGRAVITY_BIN: ${ANTIGRAVITY_BIN:-agy}
      ANTIGRAVITY_MODEL: ${ANTIGRAVITY_MODEL:-gemini-3.8-flash-high}
      AG_UNLOCKER_ENABLED: ${AG_UNLOCKER_ENABLED:-true}
      AG_UNLOCKER_CODE: ${AG_UNLOCKER_CODE:-}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-1}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,web}
      MEMORY_AUTO_UPDATE: ${MEMORY_AUTO_UPDATE:-true}
      MEMORY_MODEL: ${MEMORY_MODEL:-}
      MEMORY_CHECK_INTERVAL: ${MEMORY_CHECK_INTERVAL:-5m}
      MEMORY_MIN_NEW_MESSAGES: ${MEMORY_MIN_NEW_MESSAGES:-6}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_data:/app/data
      - agy_auth:/home/app/.gemini
      - ag_unlocker_data:/home/app/.local/share/agunlocker
      - cli_codex:/home/app/.codex
      - cli_claude:/home/app/.claude
    # Если анлокер или Google API в Docker падают с ошибкой 400 по IPv6,
    # раскомментируйте отключение IPv6 в контейнере:
    # sysctls:
    #   - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1;
          if [ "$$PROVIDER" = "antigravity" ]; then
            case "$$(printf '%s' "$${AG_UNLOCKER_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on)
                node -e 'const fs=require("fs"),net=require("net"),p=(process.env.XDG_DATA_HOME||process.env.HOME+"/.local/share")+"/agunlocker/proxy_port";let port=53129;try{const v=fs.readFileSync(p,"utf8").trim();if(v)port=Number(v)}catch{};const s=net.connect({host:"127.0.0.1",port});s.setTimeout(1000);s.on("connect",()=>{s.destroy();process.exit(0)});s.on("timeout",()=>{s.destroy();process.exit(1)});s.on("error",()=>process.exit(1))' || exit 1
                ;;
            esac;
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:3000:80"

volumes:
  app_data:
  agy_auth:
  ag_unlocker_data:
  cli_codex:
  cli_claude:
