services:
  backend:
    ports: !reset []
    environment:
      TRUST_PROXY_HEADERS: "true"
      CORS_ORIGIN: https://${DOMAIN}
      AG_UNLOCKER_ENABLED: ${AG_UNLOCKER_ENABLED:-true}
      AG_UNLOCKER_CODE: ${AG_UNLOCKER_CODE:-}
    mem_limit: 2g

  web:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
